apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: svastik
  labels:
    service: web
spec:
  replicas: 2
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      containers:
      - name: web
        image: robotshop/rs-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 126m
            memory: 63Mi
          requests:
            cpu: 63m
            memory: 32Mi
      restartPolicy: Always