# FILE: infra/k8s/spark/robot-shop-web-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: svastik
  labels:
    service: web
spec:
  replicas: 2
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      containers:
        - name: web
          image: robotshop/rs-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 216m  # scaled by approx. 8m
              memory: 100Mi  # held constant
            requests:
              cpu: 108m  # scaled by approx. 8m
              memory: 52Mi  # held constant
      restartPolicy: Always