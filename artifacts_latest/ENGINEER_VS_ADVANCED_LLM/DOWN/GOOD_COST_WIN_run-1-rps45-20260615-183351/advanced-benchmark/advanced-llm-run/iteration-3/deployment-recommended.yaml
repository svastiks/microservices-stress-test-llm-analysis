apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: svastik
  labels:
    service: web
  annotations:
    squeeze/reconcile-ts: '1781112836'
spec:
  replicas: 3
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      containers:
      - name: web
        image: robotshop/rs-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 203m
            memory: 102Mi
          requests:
            cpu: 108m
            memory: 51Mi
      restartPolicy: Always