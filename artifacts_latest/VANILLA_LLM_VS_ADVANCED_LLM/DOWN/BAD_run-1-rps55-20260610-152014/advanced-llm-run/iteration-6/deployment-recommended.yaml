# FILE: infra/k8s/spark/robot-shop-web-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: svastik
  labels:
    service: web
  annotations:
    squeeze/reconcile-ts: '1781120599'
spec:
  replicas: 1
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      containers:
      - name: web
        image: robotshop/rs-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 162m
            memory: 72Mi
          requests:
            cpu: 80m
            memory: 40Mi
      restartPolicy: Always