apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: svastik
  labels:
    service: web
  annotations:
    squeeze/reconcile-ts: '1781066636'
spec:
  replicas: 3
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      containers:
      - name: web
        image: robotshop/rs-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 216m
            memory: 109Mi
          requests:
            cpu: 115m
            memory: 55Mi
      restartPolicy: Always