# FILE: infra/k8s/spark/robot-shop-web-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: svastik
  labels:
    service: web
spec:
  replicas: 3
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      containers:
        - name: web
          image: robotshop/rs-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 220m
              memory: 110Mi
            requests:
              cpu: 110m
              memory: 55Mi
      restartPolicy: Always