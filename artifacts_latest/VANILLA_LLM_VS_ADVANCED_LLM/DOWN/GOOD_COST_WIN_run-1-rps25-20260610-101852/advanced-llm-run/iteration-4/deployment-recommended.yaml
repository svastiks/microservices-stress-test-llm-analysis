apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: svastik
  labels:
    service: web
  annotations:
    squeeze/reconcile-ts: '1781101973'
spec:
  replicas: 2
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      containers:
      - name: web
        image: robotshop/rs-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 155m
            memory: 78Mi
          requests:
            cpu: 88m
            memory: 42Mi
      restartPolicy: Always